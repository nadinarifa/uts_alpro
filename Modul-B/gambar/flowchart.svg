<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 2260" width="100%" height="100%" style="background-color: #f8fafc; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Marker Arrowhead -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <style>
    .title { font-size: 24px; font-weight: 800; fill: #1e293b; text-anchor: middle; }
    .subtitle { font-size: 14px; fill: #64748b; text-anchor: middle; }
    .node-text { font-size: 13px; font-weight: 600; text-anchor: middle; fill: #1e293b; }
    .node-subtext { font-size: 11.5px; text-anchor: middle; fill: #334155; }
    .term-text { font-size: 14px; font-weight: bold; fill: #ffffff; text-anchor: middle; }
    .arrow-line { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .arrow-line-green { stroke: #16a34a; stroke-width: 2; fill: none; marker-end: url(#arrow-green); }
    .arrow-line-red { stroke: #dc2626; stroke-width: 2; fill: none; marker-end: url(#arrow-red); }
    .badge-ya { fill: #dcfce7; stroke: #86efac; stroke-width: 1; }
    .badge-tidak { fill: #fee2e2; stroke: #fca5a5; stroke-width: 1; }
    .badge-text-ya { font-size: 11px; font-weight: bold; fill: #166534; text-anchor: middle; }
    .badge-text-tidak { font-size: 11px; font-weight: bold; fill: #991b1b; text-anchor: middle; }
  </style>

  <!-- Title Section -->
  <text x="460" y="45" class="title">FLOWCHART MODUL B: REKAPITULASI ANGGARAN</text>
  <text x="460" y="70" class="subtitle">Studi Kasus 09 | Penanggung Jawab: Bryant Anthony Kores Obhetan (322610003)</text>

  <!-- 1. Start Node -->
  <rect x="380" y="95" width="160" height="42" rx="21" fill="#4f46e5" filter="url(#shadow)" />
  <text x="460" y="121" class="term-text">Mulai</text>

  <!-- Connector -->
  <line x1="460" y1="137" x2="460" y2="165" class="arrow-line" />

  <!-- 2. Init Accumulators (Process) -->
  <rect x="235" y="165" width="450" height="75" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)" />
  <text x="460" y="188" class="node-text">Inisialisasi Variabel Akumulator:</text>
  <text x="460" y="206" class="node-subtext">totalRencana = 0, totalRealisasi = 0, totalPenghematan = 0, totalKelebihan = 0</text>
  <text x="460" y="224" class="node-subtext">jumlahHemat = 0, jumlahTepat = 0, jumlahMelebihi = 0, totalKomponen = 0, penyimpanganTerbesar = 0</text>

  <!-- Connector -->
  <line x1="460" y1="240" x2="460" y2="270" class="arrow-line" />

  <!-- Target Point for Repeat Loop (Top of Loop) -->
  <circle cx="460" cy="270" r="4" fill="#3b82f6" />

  <!-- Connector to Input Nama -->
  <line x1="460" y1="270" x2="460" y2="295" class="arrow-line" />

  <!-- 3. Input namaKomponen (I/O - Parallelogram) -->
  <polygon points="340,295 600,295 560,345 300,345" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" filter="url(#shadow)" />
  <text x="450" y="325" class="node-text">Input: namaKomponen</text>

  <!-- Connector -->
  <line x1="450" y1="345" x2="450" y2="375" class="arrow-line" />

  <!-- 4. Decision: Nama Kosong? (Diamond) -->
  <polygon points="450,375 565,415 450,455 335,415" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#shadow)" />
  <text x="450" y="418" class="node-text">namaKomponen kosong?</text>

  <!-- Decision Loop Back (Ya) -->
  <path d="M 565 415 L 640 415 L 640 320 L 590 320" class="arrow-line-red" />
  <rect x="580" y="405" width="28" height="18" rx="4" class="badge-tidak" />
  <text x="594" y="418" class="badge-text-tidak">Ya</text>

  <!-- Decision Continue (Tidak) -->
  <line x1="450" y1="455" x2="450" y2="485" class="arrow-line-green" />
  <rect x="456" y="458" width="40" height="18" rx="4" class="badge-ya" />
  <text x="476" y="471" class="badge-text-ya">Tidak</text>

  <!-- 5. Input anggaranRencana (I/O) -->
  <polygon points="330,485 610,485 570,535 290,535" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" filter="url(#shadow)" />
  <text x="450" y="515" class="node-text">Input: anggaranRencana (Rp)</text>

  <!-- Connector -->
  <line x1="450" y1="535" x2="450" y2="565" class="arrow-line" />

  <!-- 6. Decision: Anggaran <= 0 / bukan angka? -->
  <polygon points="450,565 575,605 450,645 325,605" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#shadow)" />
  <text x="450" y="601" class="node-text">Bukan angka atau</text>
  <text x="450" y="617" class="node-text">anggaranRencana &lt;= 0?</text>

  <!-- Decision Loop Back (Ya) -->
  <path d="M 575 605 L 650 605 L 650 510 L 600 510" class="arrow-line-red" />
  <rect x="590" y="595" width="28" height="18" rx="4" class="badge-tidak" />
  <text x="604" y="608" class="badge-text-tidak">Ya</text>

  <!-- Decision Continue (Tidak) -->
  <line x1="450" y1="645" x2="450" y2="675" class="arrow-line-green" />
  <rect x="456" y="648" width="40" height="18" rx="4" class="badge-ya" />
  <text x="476" y="661" class="badge-text-ya">Tidak</text>

  <!-- 7. Input realisasi (I/O) -->
  <polygon points="340,675 600,675 560,725 300,725" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" filter="url(#shadow)" />
  <text x="450" y="705" class="node-text">Input: realisasi (Rp)</text>

  <!-- Connector -->
  <line x1="450" y1="725" x2="450" y2="755" class="arrow-line" />

  <!-- 8. Decision: Realisasi < 0 / bukan angka? -->
  <polygon points="450,755 575,795 450,835 325,795" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#shadow)" />
  <text x="450" y="791" class="node-text">Bukan angka atau</text>
  <text x="450" y="807" class="node-text">realisasi &lt; 0?</text>

  <!-- Decision Loop Back (Ya) -->
  <path d="M 575 795 L 650 795 L 650 700 L 590 700" class="arrow-line-red" />
  <rect x="590" y="785" width="28" height="18" rx="4" class="badge-tidak" />
  <text x="604" y="798" class="badge-text-tidak">Ya</text>

  <!-- Decision Continue (Tidak) -->
  <line x1="450" y1="835" x2="450" y2="865" class="arrow-line-green" />
  <rect x="456" y="838" width="40" height="18" rx="4" class="badge-ya" />
  <text x="476" y="851" class="badge-text-ya">Tidak</text>

  <!-- 9. Base Accumulation (Process) -->
  <rect x="250" y="865" width="400" height="85" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)" />
  <text x="450" y="888" class="node-text">Akumulasi Data Dasar:</text>
  <text x="450" y="907" class="node-subtext">totalKomponen = totalKomponen + 1</text>
  <text x="450" y="924" class="node-subtext">totalRencana = totalRencana + anggaranRencana</text>
  <text x="450" y="941" class="node-subtext">totalRealisasi = totalRealisasi + realisasi; selisih = realisasi - rencana</text>

  <!-- Connector -->
  <line x1="450" y1="950" x2="450" y2="980" class="arrow-line" />

  <!-- 10. Decision: Evaluasi Status (Hemat?) -->
  <polygon points="450,980 575,1020 450,1060 325,1020" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#shadow)" />
  <text x="450" y="1025" class="node-text">realisasi &lt; rencana?</text>

  <!-- Hemat Branch (Ya -> Left) -->
  <path d="M 325 1020 L 190 1020 L 190 1075" class="arrow-line-green" />
  <rect x="240" y="1008" width="28" height="18" rx="4" class="badge-ya" />
  <text x="254" y="1021" class="badge-text-ya">Ya</text>

  <rect x="70" y="1075" width="240" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)" />
  <text x="190" y="1098" class="node-text" fill="#15803d">Status: HEMAT</text>
  <text x="190" y="1118" class="node-subtext">jumlahHemat++</text>
  <text x="190" y="1132" class="node-subtext">totalPenghematan += (rencana - realisasi)</text>

  <!-- Next Decision (Tidak -> Down/Right) -->
  <line x1="450" y1="1060" x2="450" y2="1085" class="arrow-line-red" />
  <rect x="456" y="1060" width="40" height="18" rx="4" class="badge-tidak" />
  <text x="476" y="1073" class="badge-text-tidak">Tidak</text>

  <!-- 11. Decision: Tepat? -->
  <polygon points="450,1085 575,1125 450,1165 325,1125" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#shadow)" />
  <text x="450" y="1130" class="node-text">realisasi == rencana?</text>

  <!-- Tepat Branch (Ya -> Down) -->
  <line x1="450" y1="1165" x2="450" y2="1205" class="arrow-line-green" />
  <rect x="456" y="1170" width="28" height="18" rx="4" class="badge-ya" />
  <text x="470" y="1183" class="badge-text-ya">Ya</text>

  <rect x="360" y="1205" width="180" height="48" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2" filter="url(#shadow)" />
  <text x="450" y="1226" class="node-text">Status: TEPAT</text>
  <text x="450" y="1243" class="node-subtext">jumlahTepat++</text>

  <!-- Melebihi Branch (Tidak -> Right) -->
  <path d="M 575 1125 L 720 1125 L 720 1180" class="arrow-line-red" />
  <rect x="630" y="1113" width="40" height="18" rx="4" class="badge-tidak" />
  <text x="650" y="1126" class="badge-text-tidak">Tidak</text>

  <rect x="600" y="1180" width="240" height="55" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)" />
  <text x="720" y="1201" class="node-text" fill="#b91c1c">Status: MELEBIHI</text>
  <text x="720" y="1218" class="node-subtext">jumlahMelebihi++; totalKelebihan += selisih</text>

  <!-- Connector to Peak Check -->
  <line x1="720" y1="1235" x2="720" y2="1260" class="arrow-line" />

  <!-- 12. Decision: Peak Deviation Check? -->
  <polygon points="720,1260 840,1295 720,1330 600,1295" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#shadow)" />
  <text x="720" y="1300" class="node-text">selisih &gt; penyimpanganTerbesar?</text>

  <!-- Peak Update (Ya) -->
  <line x1="720" y1="1330" x2="720" y2="1360" class="arrow-line-green" />
  <rect x="726" y="1335" width="28" height="18" rx="4" class="badge-ya" />
  <text x="740" y="1348" class="badge-text-ya">Ya</text>

  <rect x="590" y="1360" width="260" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)" />
  <text x="720" y="1380" class="node-text">Update Rekor Penyimpangan:</text>
  <text x="720" y="1398" class="node-subtext">penyimpanganTerbesar = selisih; komponenTerbesar = nama</text>

  <!-- Convergence to Prompt Loop -->
  <path d="M 190 1135 L 190 1445 L 400 1445" class="arrow-line" />
  <line x1="450" y1="1253" x2="450" y2="1445" class="arrow-line" />
  <path d="M 720 1410 L 720 1445 L 500 1445" class="arrow-line" />
  <path d="M 840 1295 L 870 1295 L 870 1445 L 500 1445" class="arrow-line" />

  <!-- 13. Input: Pilihan Lanjut? (I/O) -->
  <polygon points="320,1445 610,1445 570,1495 280,1495" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" filter="url(#shadow)" />
  <text x="445" y="1475" class="node-text">Input: pilihan lanjut (y / t)</text>

  <!-- Connector -->
  <line x1="445" y1="1495" x2="445" y2="1525" class="arrow-line" />

  <!-- 14. Decision: Validasi pilihan y/t -->
  <polygon points="445,1525 585,1565 445,1605 305,1565" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#shadow)" />
  <text x="445" y="1562" class="node-text">Pilihan bukan</text>
  <text x="445" y="1578" class="node-text">'y', 'Y', 't', atau 'T'?</text>

  <!-- Loop back for invalid choice -->
  <path d="M 585 1565 L 640 1565 L 640 1470 L 590 1470" class="arrow-line-red" />
  <rect x="595" y="1555" width="28" height="18" rx="4" class="badge-tidak" />
  <text x="609" y="1568" class="badge-text-tidak">Ya</text>

  <!-- Valid Choice (Tidak) -->
  <line x1="445" y1="1605" x2="445" y2="1635" class="arrow-line-green" />
  <rect x="451" y="1610" width="40" height="18" rx="4" class="badge-ya" />
  <text x="471" y="1623" class="badge-text-ya">Tidak</text>

  <!-- 15. Decision: Ulangi Perulangan? (pilihan == 'y') -->
  <polygon points="445,1635 570,1675 445,1715 320,1675" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#shadow)" />
  <text x="445" y="1680" class="node-text">pilihan == 'y' atau 'Y'?</text>

  <!-- Big Loop Back to Top of Loop (Ya) -->
  <path d="M 320 1675 L 30 1675 L 30 270 L 450 270" class="arrow-line-green" />
  <rect x="180" y="1663" width="28" height="18" rx="4" class="badge-ya" />
  <text x="194" y="1676" class="badge-text-ya">Ya</text>

  <!-- Exit Loop (Tidak -> Rekapitulasi Akhir) -->
  <line x1="445" y1="1715" x2="445" y2="1750" class="arrow-line-red" />
  <rect x="451" y="1720" width="40" height="18" rx="4" class="badge-tidak" />
  <text x="471" y="1733" class="badge-text-tidak">Tidak</text>

  <!-- 16. Calc Persentase Penyerapan (Process) -->
  <rect x="250" y="1750" width="390" height="60" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)" />
  <text x="445" y="1775" class="node-text">Hitung Persentase Penyerapan:</text>
  <text x="445" y="1795" class="node-subtext">Jika totalRencana > 0 maka (totalRealisasi / totalRencana) * 100, selain itu 0</text>

  <!-- Connector -->
  <line x1="445" y1="1810" x2="445" y2="1840" class="arrow-line" />

  <!-- 17. Decision: Evaluasi Kondisi Kegiatan Keseluruhan -->
  <polygon points="445,1840 600,1880 445,1920 290,1880" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#shadow)" />
  <text x="445" y="1885" class="node-text">totalRealisasi &lt; totalRencana?</text>

  <!-- Kondisi Hemat (Ya -> Left) -->
  <path d="M 290 1880 L 170 1880 L 170 1930" class="arrow-line-green" />
  <rect x="220" y="1868" width="28" height="18" rx="4" class="badge-ya" />
  <text x="234" y="1881" class="badge-text-ya">Ya</text>

  <rect x="65" y="1930" width="210" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)" />
  <text x="170" y="1955" class="node-text" fill="#15803d">kondisi = "Hemat"</text>

  <!-- Check Sesuai Anggaran (Tidak -> Down) -->
  <line x1="445" y1="1920" x2="445" y2="1950" class="arrow-line-red" />
  <rect x="451" y="1922" width="40" height="18" rx="4" class="badge-tidak" />
  <text x="471" y="1935" class="badge-text-tidak">Tidak</text>

  <polygon points="445,1950 600,1990 445,2030 290,1990" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#shadow)" />
  <text x="445" y="1995" class="node-text">totalRealisasi == totalRencana?</text>

  <!-- Kondisi Sesuai Anggaran (Ya) -->
  <line x1="445" y1="2030" x2="445" y2="2060" class="arrow-line-green" />
  <rect x="451" y="2035" width="28" height="18" rx="4" class="badge-ya" />
  <text x="465" y="2048" class="badge-text-ya">Ya</text>

  <rect x="330" y="2060" width="230" height="40" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2" filter="url(#shadow)" />
  <text x="445" y="2085" class="node-text">kondisi = "Sesuai Anggaran"</text>

  <!-- Kondisi Melebihi (Tidak -> Right) -->
  <path d="M 600 1990 L 730 1990 L 730 2060" class="arrow-line-red" />
  <rect x="640" y="1978" width="40" height="18" rx="4" class="badge-tidak" />
  <text x="660" y="1991" class="badge-text-tidak">Tidak</text>

  <rect x="620" y="2060" width="220" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)" />
  <text x="730" y="2085" class="node-text" fill="#b91c1c">kondisi = "Melebihi Anggaran"</text>

  <!-- Convergence to Output -->
  <path d="M 170 1970 L 170 2130 L 320 2130" class="arrow-line" />
  <line x1="445" y1="2100" x2="445" y2="2130" class="arrow-line" />
  <path d="M 730 2100 L 730 2130 L 570 2130" class="arrow-line" />

  <!-- 18. Output: Tampilkan Laporan Rekapitulasi (I/O) -->
  <polygon points="210,2130 710,2130 670,2190 170,2190" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" filter="url(#shadow)" />
  <text x="440" y="2155" class="node-text">Output: Laporan Rekapitulasi Lengkap</text>
  <text x="440" y="2175" class="node-subtext">Total Rencana, Realisasi, Penghematan, Kelebihan, Penyerapan, Statistik Komponen, Peak, &amp; Kondisi</text>

  <!-- Connector -->
  <line x1="440" y1="2190" x2="440" y2="2215" class="arrow-line" />

  <!-- 19. Selesai (Terminal) -->
  <rect x="360" y="2215" width="160" height="42" rx="21" fill="#4f46e5" filter="url(#shadow)" />
  <text x="440" y="2241" class="term-text">Selesai</text>
</svg>
